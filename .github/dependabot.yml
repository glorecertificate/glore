version: 2

updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: monthly
    cooldown:
      default-days: 2
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      deps:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      deps-dev:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 2
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
