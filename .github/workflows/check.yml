name: Check

on: workflow_call

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          strict-peer-dependencies: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: tsc-${{ runner.os }}-
      - name: Run code checks
        run: pnpm run check
      - name: Run unit tests
        run: pnpm run test

  history:
    name: Linear history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject merge commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merges="$(git rev-list --merges "$BASE_SHA..HEAD")"
          if [ -n "$merges" ]; then
            echo "Merge commits are not allowed. Rebase the branch: $merges"
            exit 1
          fi
      - name: Reject fixup commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          fixups="$(git log --format='%h %s' "$BASE_SHA..HEAD" | grep -E '^[0-9a-f]+ (fixup|squash|amend)! ' || true)"
          if [ -n "$fixups" ]; then
            echo "Fold the fixup commits first: git rebase -i --autosquash main"
            echo "$fixups"
            exit 1
          fi
