name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent' && github.event.issue.state == 'open') ||
      (github.event_name != 'issues' && contains(github.event.comment.body || github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Reject fork pull requests
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          fork=false
          if [ "$IS_PR" = "true" ]; then
            fork="$(gh pr view "$NUMBER" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)"
          fi
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
          if [ "$fork" = "true" ]; then
            echo "::notice::Claude does not run scripts from fork pull requests."
          fi
      - uses: ./.github/actions/setup
        if: steps.source.outputs.fork == 'false'
      - name: Run Claude
        if: steps.source.outputs.fork == 'false'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: agent
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(pnpm run check),Bash(pnpm run test),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git push -u origin claude/:*),Bash(git push origin HEAD),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
            --append-system-prompt "Follow AGENTS.md and .agents/specs/github.md. Run pnpm run check until it exits 0 before each commit. On a PR, make each fix with git commit --fixup=<sha> of the commit that it changes. For an issue, open a PR with Closes #<number> and the issue labels. When you are blocked on a decision, add the needs-human label, post one comment with the question, and stop. Never merge, approve, force-push, or change .github/workflows."
