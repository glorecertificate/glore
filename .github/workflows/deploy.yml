name: Deploy

on:
  workflow_call:
    inputs:
      domain:
        description: Domain to point at the deployment. An empty value keeps every domain.
        default: ''
        type: string
      environment:
        description: Environment to deploy to, can be qa, preview, or production.
        default: qa
        type: string
      migrate:
        description: Run the Drizzle migrations against the target database before the build.
        default: false
        type: boolean
      ref:
        description: Commit to deploy. An empty value means the commit of the event.
        default: ''
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.environment == 'production' && 'all' || github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_TELEMETRY_DISABLED: 1
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ inputs.environment == 'qa' && vars.VERCEL_QA_PROJECT_ID || vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.vercel.outputs.url }}
    env:
      TARGET: ${{ inputs.environment == 'production' && 'production' || 'preview' }}
    steps:
      - name: Require a separate qa project
        if: inputs.environment == 'qa' && (vars.VERCEL_QA_PROJECT_ID == '' || vars.VERCEL_QA_PROJECT_ID == vars.VERCEL_PROJECT_ID)
        run: |
          echo "::error::VERCEL_QA_PROJECT_ID must be the id of the qa project."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: true
      - name: Pull environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Require the app URL of the environment
        if: inputs.environment != 'production'
        env:
          EXPECTED: ${{ inputs.environment }}.glorecertificate.xyz
        run: pnpm exec dotenv -o -e ".vercel/.env.$TARGET.local" -- node -e "if (URL.parse(process.env.APP_URL)?.host !== process.env.EXPECTED) { console.error('::error::APP_URL is not the URL of this environment.'); process.exit(1) }"
      - name: Migrate database
        if: inputs.migrate
        run: pnpm exec dotenv -e ".vercel/.env.$TARGET.local" -- pnpm exec drizzle-kit migrate
      - name: Build project artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -a
          . ".vercel/.env.$TARGET.local"
          set +a
          pnpm exec vercel build --target="$TARGET" --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(pnpm exec vercel deploy --prebuilt --archive=tgz --target="$TARGET" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Point the domain at the deployment
        if: inputs.domain != ''
        env:
          DOMAIN: ${{ inputs.domain }}
          URL: ${{ steps.vercel.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel alias set "$URL" "$DOMAIN" --token="$VERCEL_TOKEN"
