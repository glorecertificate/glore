name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy to, can be preview or production.
        default: preview
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.environment == 'production' && 'all' || github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_TELEMETRY_DISABLED: 1
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          dev-only: true
          ignore-scripts: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ inputs.environment }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ inputs.environment }}-
            nextjs-${{ runner.os }}-
      - name: Pull environment
        env:
          TARGET: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build project artifacts
        env:
          TARGET: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -a
          . ".vercel/.env.$TARGET.local"
          set +a
          pnpm exec vercel build --target="$TARGET" --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        id: vercel
        env:
          TARGET: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "url=$(pnpm exec vercel deploy --prebuilt --archive=tgz --target="$TARGET" --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
