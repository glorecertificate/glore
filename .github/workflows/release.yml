name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a release commit that was on the preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse 'HEAD^{commit}')"
          case "$(git log -1 --format=%s "$sha")" in
            "chore(release): $GITHUB_REF_NAME" | "chore(release): $GITHUB_REF_NAME "*) ;;
            *)
              echo "::error::$sha is not the release commit of $GITHUB_REF_NAME."
              exit 1
              ;;
          esac
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::$sha is not on main."
            exit 1
          }
          api="repos/$GITHUB_REPOSITORY/deployments?environment=preview-promoted&per_page=1"
          promoted="$(gh api "$api&sha=$sha" --jq '.[0].sha // ""')"
          current="$(gh api "$api" --jq '.[0].sha // ""')"
          if [ -z "$promoted" ] || ! git merge-base --is-ancestor "$sha" "$current"; then
            echo "::error::Promote $sha to the preview first."
            exit 1
          fi
  deploy:
    name: Deploy
    needs: [check, version]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      migrate: true
