name: Tasks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: tasks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tasks:
    name: Tasks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject open tasks in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          open="$(printf '%s\n' "$BODY" | grep -E '^[[:space:]]*[-*+] \[ \]' || true)"
          if [ -n "$open" ]; then
            echo "::error::Check or delete each open task in the PR body."
            printf '%s\n' "$open" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All tasks in the PR body are done." >> "$GITHUB_STEP_SUMMARY"
